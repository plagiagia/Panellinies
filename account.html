<!doctype html>
<html lang="el"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f8f5"><title>Ο λογαριασμός μου — Θέματα</title><link rel="stylesheet" href="/style.css"></head><body>
<header><a class="brand" href="/"><span class="brand-icon">✳</span> θέματα<span class="brand-dot">.</span></a><nav><a href="/#library">Βιβλιοθήκη</a><a href="/community.html">Κοινότητα</a></nav></header>
<main><section class="account-page"><a class="back-link" href="/">← Πίσω στην αρχική</a><div class="account-panel"><div class="eyebrow muted">Η ΚΟΙΝΟΤΗΤΑ ΜΑΣ</div><h1>Καλώς ήρθες<span class="green">.</span></h1><p>Συνδέσου για να συμμετέχεις στις συζητήσεις.</p>
<form class="auth-form" id="account-form"><button class="google-signin" type="button">Συνέχεια με Google</button><p class="auth-note">Στα σχόλια εμφανίζεται το όνομα χρήστη ή το μικρό σου όνομα από το Google.</p><label class="auth-name" hidden>Όνομα χρήστη <input name="name" maxlength="40" autocomplete="nickname"></label><label>Email <input name="email" type="email" required autocomplete="email"></label><label>Κωδικός <input name="password" type="password" minlength="6" required autocomplete="current-password"></label><div class="auth-actions"><button type="submit">Σύνδεση</button><button class="auth-switch" type="button">Δημιουργία λογαριασμού</button></div></form>
<div class="account-signed-in" hidden><p></p><button type="button">Αποσύνδεση</button></div><p class="account-status" role="status" aria-live="polite"></p></div></section></main>
<footer><a class="brand" href="/"><span class="brand-icon">✳</span> θέματα<span class="brand-dot">.</span></a><p>Φτιαγμένο για κάθε μαθητή που ονειρεύεται.</p><span>ΚΑΛΗ ΕΠΙΤΥΧΙΑ ✳</span></footer><script type="module" src="/src/account.ts"></script><script type="module" src="/src/site.ts"></script></body></html>
